name: Publicar portfolio .NET
on:
  push:
    paths:
      - "portfolio-dotnet/.upload/**"
      - ".github/workflows/portfolio-extract.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expandir fontes e configurar CI
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, shutil, sys
          base = pathlib.Path("portfolio-dotnet")
          staging = base / ".upload"
          chunks = [staging / f"chunk{i:02}" for i in range(1, 7)]
          if not all(x.is_file() for x in chunks):
              print("Arquivos de transferencia ausentes; nenhuma alteracao.")
              sys.exit(0)
          encoded = "".join(x.read_text(encoding="ascii") for x in chunks)
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = "52a50d8436bf2632afbc3d072c4121383375bebfadace540bcf9174745d0babb"
          if hashlib.sha256(data).hexdigest() != expected:
              raise ValueError("Falha na verificacao SHA-256 dos fontes")
          manifest = json.loads(data)
          if len(manifest) != 91:
              raise ValueError(f"Quantidade de arquivos inesperada: {len(manifest)}")
          root = base.resolve()
          for name, content in manifest.items():
              destination = (base / name).resolve()
              if not destination.is_relative_to(root):
                  raise ValueError(f"Caminho invalido: {name}")
              if not isinstance(content, str):
                  raise ValueError(f"Conteudo nao textual: {name}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(content, encoding="utf-8")
          ci = manifest[".github/workflows/dotnet-ci.yml"]
          for i in ("01-TaskFlow", "02-StockPilot", "03-FieldOpsAI"):
              ci = ci.replace("folder: " + i, "folder: portfolio-dotnet/" + i)
          workflows = pathlib.Path(".github/workflows")
          workflows.mkdir(parents=True, exist_ok=True)
          (workflows / "portfolio-dotnet-ci.yml").write_text(ci, encoding="utf-8")
          shutil.rmtree(staging)
          pathlib.Path(".github/workflows/portfolio-extract.yml").unlink(missing_ok=True)
          print(f"Extraidos {len(manifest)} arquivos em {base}.")
          PY
      - name: Salvar codigo-fonte no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para publicar."
            exit 0
          fi
          git commit -m "feat(portfolio): publish three .NET 10 projects"
          git push
